slides:
  - layout: title
    title: "1-RX power-up and power-down"
    bullets:
      - "Power-up passes 16 of 16; 12 V removal fails 16 of 16; CLK steady state fails at tolerance limits"
      - "FPGA order is timing only for 1V0; fixes F1c and F1b, none applied"
    note: LTspice, 8 power corners times IF at zero and full scale, 12 V removal at 14 ms. The AD9237 sheet gives no clamp current it tolerates. Nothing under kicad/ or kicad-1rx/ was changed; the choices are yours.
  - layout: figure
    title: "Order map, power-up: design or timing"
    figure: order_on.png
    note: Design means an EN or PG chain forces the order, timing means it holds only because one regulator is faster. 3V0 before 3V3A, 1V8 and 3V3D is design from rx1-seq A (the chain forces the start, not the 90 % time). 1V0 before 1V8 and 3V3D is timing; F1c makes it design, F1b leaves it timing. VCCO - VCCAUX peaks at 1.50 V against 2.625 V.
  - layout: figure
    title: "Order map, power-off at 12 V removal"
    figure: order_off.png
    note: No EN or PG chain can force a power-off order, because it acts after its source rail has fallen. 1V8 falls after 3V0 and after 1V0, and 3V3D falls after 1V0, so three off orders are the wrong way round for AVDD or DS181 p.8. The only fix class is stored charge (F2a, F2b), which does not make them right.
  - layout: figure
    title: "Power-up: rails, pins, FPGA rails"
    figure: powerup.png
    note: Top, fast and slow corner. Bottom left, the worst power-up case for CLK, PDWN and VIN+ against 3V0 + 0.3 V (dashed); the margin is 13 mV at CLK and PDWN. 3V3A, 1V8 and 3V3D start after the 3V0 EN fires in every corner (2.19 to 3.52 ms). Bottom right, the FPGA rails and a VCCO - VCCAUX maximum of 1.50 V.
  - layout: figure
    title: "Pin voltage against the limit, every case"
    figure: pins.png
    note: Pin voltage minus the AVDD + 0.3 V limit at that instant. Power-up passes in all 16 cases; 12 V removal fails in all 16. VIN, CLK and PDWN peak currents into the AVDD clamp are in brackets. The result at removal depends on the U39 model (TI as supplied here).
  - layout: figure
    title: "12 V removal: rails, pins, clamp current"
    figure: removal.png
    note: Worst case is slow U17, fast U18 and LDO, IF at zero. CLK peaks at 3.29 V on an AVDD of 0.03 V, 27.4 mA into its clamp for 1.3 ms above 10 uA; VIN 11.8 mA; PDWN 0.09 mA. The TI U39 model sinks current below 2.2 V, so 3V0 collapses faster than a real LDO; with a one-way output CLK is 4.8 mA and VIN has none. The truth lies between.
  - layout: figure
    title: "Clamp currents and the sweep of each assumption"
    figure: clamp.png
    note: Each row changes one assumption of the worst removal case. Diode model, U6 output resistance and the 3V3D load move the CLK current between 20 and 39 mA. The PG behaviour below 1.25 V (VPGMIN) moves the power-up CLK from 13 mV inside the limit to 0.52 V over; the sheet states nothing there, so lay-03 should measure it. The AD9237 sheet gives no clamp current; the LTC2292 takes over 100 mA.
  - layout: figure
    title: "CLK in steady state, and the CLK fixes"
    figure: steady.png
    note: Nominal is exactly on the limit (3.3 V on AVDD 3.0 V + 0.3 V). At 3V3D +2 % and 3V0 -2 % CLK is 0.126 V over, no clamp current to speak of (0.06 uA mean); at +/-5 % 0.307 V over, 0.15 mA peak. R15 at 100 ohm does not lower the pin voltage. F3a (R15 68 ohm and 680 ohm to GND) gives 2.98 V and 3.07 V, rise 0.85 ns, duty 50.1 %.
  - layout: figure
    title: "Fixes: cost, simulated result, room on the board"
    figure: fixes.png
    note: Room comes from route_space.py and fix_space.py on today's board (read only); every part that was searched found room. F3a was searched at R15 because the AD9237 pads do not exist yet. F4b was not searched and F4a does not have the rx1-02 settling and IF response rerun. Rejected rows are kept with the reason.
  - layout: decisions
    title: "For your review"
    bullets:
      - "Choose for 1V0 before 1V8 and 3V3D: F1c supervisor on 1V0 (1 part, design) or F1b 4.7 uF on the U23 EN (1 part, timing)"
      - "12 V removal: no tried fix passes every case; accept the 4.8 to 27.4 mA CLK clamp current, or choose a fix to simulate"
      - "CLK steady state: F3a divider (R15 68 ohm, 680 ohm to GND) is the one that works"
      - "lay-03 at bring-up: 12 V, 3V8, 3V0, 3V3A, 1V8, 3V3D, CLK, PDWN; 3V0 EN fires 2.19 to 3.52 ms, 3V0 at 90 % at 2.5 to 4.2 ms after 12 V starts, CLK never above 3V0 + 0.3 V; also the PG level below 1.25 V"
    note: The full list of waveforms lay-03 should match is the last table of the written report. A chosen fix becomes a row of parts/rx1_changes.csv for rx1-03; none is chosen, so none is added.
