# Default system target set. Every value is `assumed` until the user sets it
# (then change status to `set`). Reports and decks print this set, design group first;
# analyses read it via tools/targets.py.
# Range resolution is not set here: it is derived from the chirp bandwidth (c / 2B).
# The schema check fails when chirp_bandwidth_hz exceeds (freq_max_ghz - freq_min_ghz).
name: default
description: Placeholder targets for the 5.8 GHz FMCW board; not yet chosen by the user.

# Required: what the board is designed to do.
design:
  freq_min_ghz:
    value: 5.60
    unit: GHz
    status: set
    note: set by the user 2026-11-21; below the 5.725 GHz ISM band edge
  freq_max_ghz:
    value: 5.90
    unit: GHz
    status: set
    note: set by the user 2026-11-21; above the 5.875 GHz ISM band edge
  chirp_bandwidth_hz:
    value: 300000000
    unit: Hz
    status: set
    note: set by the user 2026-11-21, the whole 5.60-5.90 GHz span; cannot exceed freq_max - freq_min
  sample_rate_hz:
    value: 2000000
    unit: Hz
    status: assumed
    note: ADC sample rate after the mixer
  tx_power_dbm:
    value: 25
    unit: dBm
    status: set
    note: set by the user 2026-11-21
  tx_rx_isolation_db:
    value: 40
    unit: dB
    status: assumed
    note: antenna-to-antenna isolation
  board_quantity:
    value: 3
    unit: boards
    status: assumed

# Optional extras: performance goals that analyses may use.
performance:
  max_range_m:
    value: 100
    unit: m
    status: assumed
    note: maximum detection range
  chirp_duration_s:
    value: 0.001
    unit: s
    status: assumed
  antenna_gain_dbi:
    value: 8
    unit: dBi
    status: assumed
