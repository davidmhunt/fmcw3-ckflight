# Generated by figures.py from the latest snapshot; do not edit by hand (the build rewrites it).
slides:
- layout: title
  title: Parts availability 2026-11-25-2
  bullets:
  - Snapshot 2026-11-25-2, JLC database 2026-11-24 (daily, can lag the live site)
  - '179 lines, 4 boards: short 2, thin 1, unknown 4'
  note: 'Built by figures.py from parts/out/availability/2026-11-25-2/. DigiKey: cache only. 2 spares
    per line not in the JLC Basic library. Previous snapshot: 2026-11-25. Rerun parts/availability_report.py
    and the build for a newer snapshot. Check every short or thin JLC line on the JLC page (pre-order
    status is not in the database).'
- layout: figure
  title: Status counts per board (2026-11-25-2)
  figure: status_counts.png
  note: 'short: stock below the need; thin: covers the need with less than 3 times the need left; ok;
    unknown: no data (not in the database, or no DigiKey answer cached); no part: pads, vias, holes.'
- layout: figure
  title: 'Short lines: act first (2)'
  figure: short.png
  note: Need = refs per board x boards + spares. Stock is JLC stock (plus inventory for jlc-library) or
    DigiKey stock for sourced lines. Check on the JLC page; pre-order status is not in the database. Every
    line with its fallback is in short.csv and the PDF. A short line goes back to the user; no part was
    changed.
- layout: figure
  title: 'Thin lines: watch (1)'
  figure: thin.png
  note: Covered, but stock minus need is below 3 times the need. Full list in thin.csv and the PDF.
- layout: figure
  title: Changes since 2026-11-25
  figure: changes.png
  note: 2 line(s) changed in status or stock. Lines that appeared or disappeared are included.
- layout: figure
  title: 'Sourced and hand-solder lines: DigiKey stock'
  figure: sourced.png
  note: jlc-sourcing lines are bought by JLC from distributors; hand-solder lines are bought by the user.
    Stock is from the DigiKey cache or live answer named on the title slide.
- layout: decisions
  title: 'Unknown lines (4): no stock data'
  bullets:
  - '1-RX R19 10 nF 0402 DC-cut capacitor (part named by par-12): part not named yet: no LCSC number'
  - '2-RX R19 10 nF 0402 DC-cut capacitor (part named by par-12): part not named yet: no LCSC number'
  - '2-RX U6 PL133-37TI-R: no DigiKey data (not cached)'
  - '2-RX U8 LTC2292IUP#PBF: no DigiKey data (not cached)'
  note: 'Unknown is not ok: a part not named yet (R19 by par-12) or without a cached DigiKey answer. Run
    parts/availability_report.py without --offline to fill the DigiKey cache.'
