  verified:
  - page: function COPLANAR::calcAnalyze, backMetal branch
    item: k3 from tanh terms, q3 = K(k3)/K(k3'), qz = 1/(q1+q3), er0 = 1 + q3 qz (er-1), Z factor ZF0/2 qz
    quote: er0       = 1 + q3 * qz * ( m_parameters[EPSILONR_PRM] - 1 );
  - page: function COPLANAR::calcAnalyze
    item: first modulus k1 = w / (w + 2s), q1 = K(k1)/K(k1')
    quote: q1   = kk1 / kpk1;
