  licence: CC BY-SA 4.0 (Wikipedia contributors); secondary source, fetched at a fixed revision
  commit: 'no'
  covers: microstrip Z0 and eps_eff closed forms (Wheeler, Hammerstad 1975); Hammerstad-Jensen 1980 is user-fetch
  verified:
  - page: section Characteristic impedance
    item: Hammerstad 1975 Z0 for w/h <= 1, citing Garg, Bahl and Bozzi p. 95
    quote: \dfrac{Z_0}{2 \pi \sqrt{\varepsilon_\textrm{eff}}} \ln\left( 8 \dfrac{h}{w} + \dfrac{w}{4h} \right)
  - page: section Characteristic impedance
    item: effective dielectric constant filling factor q
    quote: q &= \frac{1}{ \sqrt{1 + 12 (h/w)} } + q_2
