  licence: Mini-Circuits copyright; free download, not redistributed here
  commit: 'no'
  covers: mixing products and spurs (two-tone third-order IM frequencies, IP3, rule-of-thumb IM level)
  verified:
  - page: 3
    item: third-order IM product frequencies at the IF
    quote: The third-order spectral components at the IF output are generated as a result of the following third-order frequency terms
  - page: 5
    item: output IP3 from the IM3 suppression, referred to the input by adding conversion loss
    quote: IP3 (dBm) = |IM3 - POUT| (dB) / 2 + POUT (dBm)
  - page: 6
    item: rule-of-thumb IM level, worked example giving -62 dBm at the input
    quote: Intermodulation power equals +16 dBm − 78 dB = -62 dBm, referred to the input.
