# Papers, textbooks, app notes and documents. Read by tools/fetch_sources.py.
# Fields: id, kind, title, url (public), access (direct|form|login), file, sha256, licence,
# commit (yes|no), verified (list of {page, item, quote} read from the downloaded file).
# commit: no files live under docs/references/files/ (gitignored). Filled by fnd-05 step 9.
#
# Each `verified` quote was checked against the downloaded file (pdftotext for PDFs; page is the
# PDF page index, which equals the printed page number for these files). Equations that pdftotext
# garbles are cited by the neighbouring sentence instead of the equation glyphs.
#
# User-fetch (paywalled; NOT in `entries` because `fetch_sources.py --check` fails on a missing
# file; add each entry here once the user has saved the file under docs/references/files/):
#   hammerstad-jensen-1980: E. Hammerstad and O. Jensen, "Accurate Models for Microstrip
#     Computer-Aided Design", 1980 IEEE MTT-S Int. Microwave Symp. Digest, pp. 407-409,
#     doi 10.1109/MWSYM.1980.1124303 (IEEE Xplore). Needed for: microstrip Z0 and eps_eff.
#   simons-cpw-2001: R. N. Simons, "Coplanar Waveguide Circuits, Components, and Systems",
#     Wiley 2001, ISBN 9780471161219 (book). Needed for: grounded-CPW (CPWG) Z0 and eps_eff.
#   wadell-1991: B. C. Wadell, "Transmission Line Design Handbook", Artech House 1991
#     (book). Needed for: independent microstrip and CPWG formulas.
#   banerjee-pll: D. Banerjee, "PLL Performance, Simulation and Design" (free from the former
#     National Semiconductor, now TI). No working public URL was found on 2026-11-20 (the
#     guessed ti.com/lit paths for snaa106 returned 404); TI SWRA029 below is used instead.
entries:
- id: ti-slva477c
  kind: app-note
  title: Basic Calculation of a Buck Converter's Power Stage (TI SLVA477C, B. Hauke)
  url: https://www.ti.com/lit/an/slva477/slva477.pdf
  access: direct
  file: docs/references/files/ti-slva477c-buck-power-stage.pdf
  sha256: 7997d9374f72a961c337c455b06b3c227d6333732bb13f078783097057f6a969
  licence: TI copyright; free download, not redistributed here
  commit: 'no'
  covers: buck power stage (duty cycle, inductor ripple, peak switch current, inductor selection)
  verified:
  - page: 2
    item: Equation 1, maximum duty cycle D = VOUT / (VIN(max) x efficiency)
    quote: The maximum input voltage is used because this leads to the maximum switch current.
  - page: 2
    item: Equation 2, inductor ripple current dIL = (VIN(max) - VOUT) x D / (fS x L), fS the minimum switching frequency
    quote: The next step in calculating the maximum switch current is to determine the inductor ripple current.
  - page: 3
    item: Equation 4, peak switch current ISW(max) = dIL/2 + IOUT(max), the inductor must exceed it
    quote: This is the peak current, the inductor, the integrated switch(es), and the external diode have to withstand.
  - page: 3
    item: Equation 5 and 6, inductor value from an estimated ripple of 20 to 40 percent of IOUT
    quote: A good estimation for the inductor ripple current is 20% to 40% of the output current.
- id: ti-swra029
  kind: app-note
  title: Fractional/Integer-N PLL Basics (TI Technical Brief SWRA029)
  url: https://www.ti.com/lit/an/swra029/swra029.pdf
  access: direct
  file: docs/references/files/ti-swra029-pll-basics.pdf
  sha256: b3e70686bce698545d88f2afeb4e6f7a63349fb392c345f9fa5797374e3f1652
  licence: TI copyright; free download, not redistributed here
  commit: 'no'
  covers: PLL loop filter (passive 2nd to 4th order), phase margin, phase noise and the 20log(N) rule
  verified:
  - page: 15
    item: composite output phase noise is the sum of all noise sources through their transfer functions
    quote: The composite phase noise of the signal we generate with our synthesizer can be easily calculated by the sum effect of all noise sources on the output.
  - page: 22
    item: Equation 17, impedance of the third-order charge-pump loop filter Z(s)
    quote: For third order loops, (and higher), we must calculate the loop phase margin, to insure
  - page: 24
    item: Equation 20 and 21, open-loop gain and phase margin of the third-order loop
    quote: The two controlling time constants are now T1=R1C1 and T2= R1C1C2/(C1+C2).
  - page: 24
    item: phase margin definition and the 40 to 45 degree target
    quote: Phase margin is defined as the open loop phase difference from 180 degrees at the frequency at which the open loop amplitude gain is unity.
  - page: 43
    item: divider noise rule, 20log(N)
    quote: multiplication by N causes loss of 20log(N) in phase noise performance; division improves by the same number.
- id: mitll-radar-equation
  kind: lecture
  title: Introduction to Radar Systems, lecture 2, The Radar Equation (MIT Lincoln Laboratory, ODonnell 2002)
  url: https://www.ll.mit.edu/sites/default/files/outreach/doc/2018-07/lecture%202.pdf
  access: direct
  file: docs/references/files/mitll-radar-equation-lecture2.pdf
  sha256: 8516e0f290c3a5863d84f450d5a3ebb4d159a3ab571f8df94efbdafb01cb639b
  licence: MIT Lincoln Laboratory courseware, no redistribution grant seen; not redistributed here
  commit: 'no'
  covers: radar range equation, S/N = Pt G^2 lambda^2 sigma / ((4 pi)^3 R^4 k Ts Bn L)
  verified:
  - page: 10
    item: noise power N = k Ts Bn and the S/N form of the range equation (equation read from the rendered slide)
    quote: Average Noise Power N = k Ts Bn
  - page: 10
    item: S/N is the detection measure
    quote: Signal to Noise Ratio (S/N or SNR) is the standard measure of a radar’s ability to detect a given target at a given range from the radar
- id: wikipedia-friis-noise
  kind: encyclopedia
  title: Friis formulas for noise (Wikipedia, revision 1264867328, 2024-12-23, wikitext)
  url: https://en.wikipedia.org/w/index.php?title=Friis_formulas_for_noise&oldid=1264867328&action=raw
  access: direct
  file: docs/references/files/wikipedia-friis-formulas-for-noise-1264867328.wikitext
  sha256: a8996f318b26a5af7424fd1a4dcbd2a76ac9fb58b3d3cacb65d3692ba15c6a7c
  licence: CC BY-SA 4.0 (Wikipedia contributors); secondary source, fetched at a fixed revision
  commit: 'no'
  covers: Friis cascade noise factor and noise temperature; a primary text (Pozar, Kraus) is still preferable
  verified:
  - page: section The Friis formula for noise factor
    item: F_total = F1 + (F2-1)/G1 + (F3-1)/(G1 G2) + ... , factors and gains as ratios
    quote: Both magnitudes are expressed as ratios, not in decibels.
  - page: section The Friis formula for noise temperature
    item: T_eq = T1 + T2/G1 + T3/(G1 G2) + ...
    quote: T_\text{eq} = T_1 + \frac{T_2}{G_1} + \frac{T_3}{G_1 G_2} + \cdots
- id: minicircuits-an00-009
